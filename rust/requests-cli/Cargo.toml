[package]
name = "requests-cli"
version = "0.1.0"
edition = "2021"
authors = ["wangluozhe"]
description = "CLI for requests-core"

[dependencies]
requests-core = { path = "../requests-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "rustls-tls", "gzip", "brotli", "deflate", "socks", "stream"] }

[[bin]]
name = "requests"
path = "src/main.rs"
